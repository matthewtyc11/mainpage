<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matt | Personal Space</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 1.5rem;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
            border: 3px solid var(--card-border);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            font-size: 1rem;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .bio {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .section-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
            text-align: left;
            padding-left: 0.5rem;
            border-left: 2px solid var(--accent);
        }

        .links-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--accent);
            transform: translateX(4px);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .link-icon {
            font-size: 1.3rem;
        }

        .arrow {
            opacity: 0.4;
            transition: transform 0.25s ease;
        }

        .link-card:hover .arrow {
            opacity: 1;
            transform: translateX(2px);
        }

        footer {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            opacity: 0.6;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.25rem;
            }
            h1 { font-size: 1.75rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 個人頭貼 (目前用名字縮寫代替，你可以換成 <img>) -->
        <div class="profile-container">
            <div class="avatar">M</div>
        </div>

        <!-- 名字與標籤 -->
        <h1>Matt</h1>
        <div class="tagline">Handsome guy</div>

        <!-- 自我介紹 -->
        <p class="bio">
            Idk
        </p>

        <!-- 作品或常用連結區塊 -->
        <div class="section-title">PROJECTS & LINKS</div>
        <div class="links-grid">
            
            <a href="https://countdown.mattdn.com" target="_blank" class="link-card">
                <div class="link-info">
                    <span class="link-icon">🕙</span>
                    <span>2F Timetable countdown</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="https://minesweeper.mattdn.com" class="link-card">
                <div class="link-info">
                    <span class="link-icon">💣</span>
                    <span>Minesweeper AI</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <a href="mailto:admin@mattdn.com" class="link-card">
                <div class="link-info">
                    <span class="link-icon">✉️</span>
                    <span>Contact Me</span>
                </div>
                <span class="arrow">→</span>
            </a>

        </div>

        <footer>
            © <script>document.write(new Date().getFullYear())</script> 
        </footer>
    </div>

</body>
</html>
